<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuizFlow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('quizflow-theme') || 'light';
    } catch(e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="nav-wrap">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-icon">✧</span>
        <span>QuizFlow<span class="brand-dot">.</span></span>
      </a>
      <nav>
        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Home</a>
        <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">About</a>
        <a class="nav-link {% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">Quiz history</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">☾</button>
    </div>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span>Practice at your pace. Your results stay on this device.</span>
    <a href="{{ url_for('history') }}">View quiz history&nbsp; →</a>
  </footer>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
